name: Docs CI

on:
  push:
    branches: [staging]
  pull_request:

# Least privilege (security review 2026-11-14): the job only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
